<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>حجز العربة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F4F6F3;--card:#fff;--ink:#0F2A2E;--mut:#5d6f6b;--line:#D5DDD9;--go:#1B9A6C;--amb:#F5B335;--red:#B3261E}
@media(prefers-color-scheme:dark){:root{--bg:#0C1A1D;--card:#142A2E;--ink:#E8F0EE;--mut:#9DB0AB;--line:#2A4247}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.6}
header{background:#0F2A2E;color:#fff;padding-top:env(safe-area-inset-top,0)}header .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:6px}
.brand{color:#fff;font-weight:700;font-size:18px;text-decoration:none}.nv{color:#fff;opacity:.85;text-decoration:none;padding:6px 12px;border-radius:8px}.nv:hover{background:rgba(255,255,255,.12)}
.w{max-width:640px;margin:0 auto;padding:16px}.w.wide{max-width:1100px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:18px 0 0}.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
button.on,button.go{background:var(--go);border-color:var(--go);color:#fff}button.red{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.4;cursor:default}:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:4px}
label{display:block;font-weight:600;font-size:14px;margin-top:10px}
.ban{border-radius:12px;padding:12px 14px;font-weight:700;margin-top:14px;background:var(--card);border:1px solid var(--line)}.ban.g{background:var(--go);border-color:var(--go);color:#fff}
.cnt{display:flex;gap:8px;margin-top:14px}.cnt div{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}.cnt b{font-size:24px;display:block}
ol.m{list-style:none;margin:14px 0 0;padding:0}ol.m li{position:relative;display:flex;gap:14px;padding-bottom:18px}
ol.m li:not(:last-child)::before{content:"";position:absolute;right:13px;top:26px;bottom:-2px;width:5px;border-radius:3px;background:var(--line)}ol.m li.p:not(:last-child)::before{background:var(--go)}
.dot{z-index:1;flex:none;width:28px;height:28px;border-radius:50%;background:#9AA9A4;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
li.p .dot{background:var(--go)}li.c .dot{background:var(--amb);color:#0F2A2E;width:36px;height:36px;margin:-4px -4px 0;box-shadow:0 0 0 5px rgba(245,179,53,.35)}
.nm{flex:1;display:flex;justify-content:space-between;gap:8px}li.c .nm b{font-size:18px}
.chip{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 10px;white-space:nowrap;align-self:flex-start}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.no{flex:none;min-width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--go);color:#fff}.no.w{background:var(--amb);color:#0F2A2E}
.row .t{flex:1;min-width:0}.row small{display:block;color:var(--mut)}.row .a{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.row .a button{padding:4px 9px;font-size:14px}
#toast{position:fixed;inset-inline:16px;bottom:16px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;display:none;z-index:99;max-width:608px;margin:auto}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(92vw,460px);max-height:90vh}dialog::backdrop{background:rgba(0,0,0,.55)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:18px 0 14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
details{border-top:1px solid var(--line);padding:6px 0}summary{cursor:pointer;font-weight:600}
/* dashboard */
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.top .bt{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;border-inline-start:5px solid var(--go)}.kpi b{font-size:28px;display:block;line-height:1.2}
.kpi.a{border-inline-start-color:var(--amb)}.kpi.x{border-inline-start-color:#8a9893}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chips button{padding:6px 14px;font-size:14px;border-radius:99px}.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec{margin-top:20px}.sec>summary{font-size:18px;font-weight:700;list-style:none;border:0}.sec>summary::-webkit-details-marker{display:none}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;border-inline-start:5px solid var(--go);cursor:pointer}
.cc.going{border-inline-start-color:var(--amb)}.cc.closed,.cc.done{border-inline-start-color:#8a9893}.cc:hover{box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ct{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:0 9px;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:5px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--go)}
.cb{display:flex;gap:6px;margin-top:8px}.cb button{padding:5px 10px;font-size:13px;flex:1}
.stt{font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;background:var(--go);color:#fff}.stt.going{background:var(--amb);color:#0F2A2E}.stt.closed,.stt.done{background:#8a9893}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.ctl button{padding:12px 8px}
.lk{display:flex;gap:8px;margin-top:10px}.lk input{margin:0;direction:ltr;font-size:13px}.lk button{white-space:nowrap}
.sh{font-weight:700;padding:8px 0 2px;color:var(--go)}.sh.w{color:#b57e00;border-top:2px dashed var(--line);margin-top:8px;padding-top:10px}
.two{display:grid;grid-template-columns:1fr;gap:0}@media(min-width:900px){.two{grid-template-columns:1fr 1fr;gap:14px}}
</style></head><body>
<header><div class="in"><a href="#/" class="brand">🚐 حجز العربة</a></div></header>
<div id="app" class="w"></div>
<footer>© 2026 Botros Ekram. جميع الحقوق محفوظة</footer>
<dialog id="dlg"><form id="dform" method="dialog"><h3 id="dt" style="margin:0"></h3><div id="df"></div><div class="g2"><button class="go" id="dok">حفظ</button><button value="cancel" formnovalidate>إلغاء</button></div></form></dialog>
<dialog id="dlg2"><div id="mg"></div><button id="mgx" style="width:100%;margin-top:14px">إغلاق</button></dialog>
<dialog id="dlg3"><div id="gg"></div><button id="ggx" style="width:100%;margin-top:14px">إغلاق</button></dialog>
<div id="toast" role="status"></div>
<script>
/* ===== بيانات Supabase (Project URL + Publishable/anon key) ===== */
const SUPABASE_URL = 'https://pabvyydctwwufmiecmzc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_b6mILrA24y6WDle98R-UHw_mWtdJw9o';
/* ================================================================= */
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sb=SUPABASE_URL?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let B=[],ST=[],CARS=[],GR=[],role=null,PW='',notes={},mine={},prev=null,filt='all',loaded=false,LAST=null;
try{mine=JSON.parse(localStorage.getItem('mine2')||'{}')}catch(e){}
const saveMine=()=>{try{localStorage.setItem('mine2',JSON.stringify(mine))}catch(e){}};
const dev=(()=>{try{let d=localStorage.getItem('dev1');if(!d){d=[...Array(24)].map(()=>Math.floor(Math.random()*16).toString(16)).join('');localStorage.setItem('dev1',d)}return d}catch(e){return ''}})();
const nk=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
const ss=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},ssSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},ssDel=k=>{try{sessionStorage.removeItem(k)}catch(e){}};
const P=c=>c?ST.filter(s=>s.car_id===c.id&&s.kind==='pickup').sort((a,b)=>a.ord-b.ord):[],D=c=>c?ST.filter(s=>s.car_id===c.id&&s.kind==='drop').sort((a,b)=>a.ord-b.ord):[],nm=id=>(ST.find(s=>s.id===id)||{}).name||'؟';
const carB=c=>c?B.filter(x=>x.car_id===c.id):[],grp=c=>c.group?{name:c.group}:GR.find(g=>g.id===c.group_id);
const R=()=>location.hash.replace(/^#\/?/,'').split('/').filter(Boolean),go=p=>{location.hash='#/'+p};
const curCar=()=>{const r=R();return r[0]==='car'?CARS[0]:(r[0]==='admin'&&r[1]==='car'?CARS.find(c=>c.id===+r[2]):null)};
const linkT=t=>location.href.split('#')[0]+'#/car/'+t;
const STL={open:'متاحة',closed:'مغلقة',going:'في رحلة',done:'منتهية'};
const capOf=c=>c.capacity==null?Infinity:c.capacity;let skew=0;
const opened=c=>!c.book_at||Date.now()+skew>=Date.parse(c.book_at);
async function copy(t){try{await navigator.clipboard.writeText(t);toast('تم نسخ الرابط')}catch(e){prompt('انسخ الرابط',t)}}
/* ---- وقت 12 ساعة ---- */
const t12=s=>{if(!s)return'';let[h,m]=s.split(':').map(Number);const ap=h>=12?'م':'ص';h=h%12||12;return h+':'+String(m).padStart(2,'0')+' '+ap};
const HR=[...Array(12)].map((_,i)=>[i+1,String(i+1)]),MN=[...Array(60)].map((_,i)=>[i,String(i).padStart(2,'0')]);
const to24=(h,m,ap)=>ap?String((+h%12)+(ap==='م'?12:0)).padStart(2,'0')+':'+String(+m).padStart(2,'0'):'';
const from24=s=>{if(!s)return{h:7,m:0,ap:''};const[h,m]=s.split(':').map(Number);return{h:h%12||12,m:m,ap:h>=12?'م':'ص'}};
const bt=(iso,sec)=>{const d=new Date(iso),z='Africa/Cairo',day=x=>x.toLocaleDateString('en-CA',{timeZone:z});
 const o={timeZone:z,hour:'numeric',minute:'2-digit',hour12:true};if(sec)o.second='2-digit';if(sec==='ms')o.fractionalSecondDigits=3;
 const t=new Intl.DateTimeFormat('en-US',o).format(d).replace('AM','ص').replace('PM','م');
 const n=new Date(),y=new Date(n.getTime()-864e5),tm=new Date(n.getTime()+864e5),dd=day(d);
 const lb=dd===day(n)?'اليوم':dd===day(y)?'امبارح':dd===day(tm)?'بكرة':new Intl.DateTimeFormat('en-GB',{timeZone:z,day:'numeric',month:'numeric'}).format(d);
 return lb+' '+t};
const cz=iso=>Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Africa/Cairo',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date(iso)).map(x=>[x.type,x.value]));
const cairoToIso=(d,t)=>{const g=new Date(d+'T'+t+':00Z'),p=cz(g);return new Date(g.getTime()-(Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute)-g.getTime())).toISOString()};
const isoToCairo=iso=>{if(!iso)return{d:'',t:''};const p=cz(iso);return{d:p.year+'-'+p.month+'-'+p.day,t:p.hour+':'+p.minute}};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4500)}

/* ---- الدخول والبيانات ---- */
async function auth(){const r=R();role=null;PW='';
 if(r[0]==='car'){for(const pw of [ss('drv:'+r[1]),ss('adm')]){if(!pw)continue;const {data}=await sb.rpc('driver_login',{p_token:r[1],pw});if(data){role=data;PW=pw;return}}}
 else if(r[0]==='admin'){const pw=ss('adm');if(pw){const {data}=await sb.rpc('admin_login',{pw});if(data){role='admin';PW=pw}}}}
function logout(){const r=R();if(role==='admin')ssDel('adm');else if(r[0]==='car')ssDel('drv:'+r[1]);role=null;PW='';notes={};load()}
async function rpc(fn,args,ok){const {data,error}=await sb.rpc(fn,args);
 if(error){toast(error.message);if(error.message.includes('كلمة المرور غير صحيحة'))logout();return null}
 if(ok)toast(ok);await load();return {data}}
const confIds=()=>CARS.flatMap(c=>carB(c).slice(0,capOf(c)).map(x=>x.id));
async function load(){if(!sb)return;const r=R();
 if(r[0]==='car'){const {data,error}=await sb.rpc('car_view',{p_token:r[1]});if(error){toast('تعذر الاتصال: '+error.message);return}
  CARS=data?[data.car]:[];B=data?data.bookings:[];ST=data?data.stops:[];GR=[];if(data)skew=Date.parse(data.now)-Date.now()}
 else if(r[0]==='admin'&&role==='admin'){const {data,error}=await sb.rpc('admin_data',{pw:PW});if(error){logout();return}CARS=data.cars;GR=data.groups;B=data.bookings;ST=data.stops;skew=Date.parse(data.now)-Date.now()}
 else{CARS=[];B=[];GR=[];ST=[]}
 const nc=role&&curCar();notes={};
 if(nc){const n=await sb.rpc('staff_notes',{pw:PW,p_car:nc.id});if(n.error){logout();return}n.data.forEach(x=>notes[x.booking_id]=x.note)}
 const old=prev,conf=confIds();loaded=true;
 if(old){const was=new Set(old.all),oc=new Set(old.conf);const up=B.filter(x=>conf.includes(x.id)&&!oc.has(x.id)&&was.has(x.id));
  if(up.length)toast('اتأكد حجز '+up.map(x=>x.name).join(' و ')+' بدل المعتذر')}
 prev={all:B.map(x=>x.id),conf};render()}

/* ---- مكونات مشتركة ---- */
const banner=c=>{const dp=c.depart?' - موعد الانطلاق '+t12(c.depart):'',cs=P(c).find(s=>s.ord===c.cur);
 return c.status==='open'?(opened(c)?'الحجز مفتوح - الرحلة لم تبدأ بعد'+dp:'⏳ الحجز لسه مفتحش - هيفتح '+bt(c.book_at)+dp):c.status==='closed'?'الحجز مقفول'+dp:c.status==='going'?'السائق بدأ الرحلة - العربة دلوقتي عند: '+(cs?cs.name:'—')+dp:'انتهت الرحلة'};
function metroHtml(c,conf){const PS=P(c),going=c.status==='going'||c.status==='done';
 if(!PS.length)return '<p class="mut">لسه مفيش محطات في خط السير.'+(role?' ضيفها من "🚏 إدارة المحطات".':'')+'</p>';
 const o=conf.filter(x=>!x.stop_id).length;
 return '<ol class="m">'+PS.map((s,i)=>{const k=conf.filter(x=>x.stop_id===s.id).length,cl=c.status==='done'||(going&&c.cur>s.ord)?'p':(going&&c.cur===s.ord?'c':'');
  return `<li class="${cl}"><span class="dot">${i+1}</span><div class="nm"><span>${cl==='c'?'<b>'+esc(s.name)+'</b>':esc(s.name)}</span>${k?`<span class="chip">${k} صعود</span>`:''}</div></li>`}).join('')+'</ol>'+(o?`<p class="mut sm">+ ${o} راكب بأماكن ركوب مكتوبة بالوصف (شوف القايمة)</p>`:'')}
function cntHtml(c,conf,w){return c.capacity==null?`<div class="cnt"><div><b>${conf.length}</b>عدد الحاجزين (غير محدود)</div></div>`:`<div class="cnt"><div><b>${conf.length}</b>مؤكد من ${c.capacity}</div><div><b>${w}</b>احتياطي</div><div><b>${Math.max(0,c.capacity-conf.length)}</b>مقاعد فاضية</div></div>`}
function rowsHtml(c,bs,staff){const cap=capOf(c),open=c.status==='open';
 const row=(x,i)=>{const m=x.id in mine;
  const nt=staff&&notes[x.id]?`<small>📝 ${esc(notes[x.id])}</small>`:(m&&mine[x.id].n?'<small>📝 ملاحظتك اتبعتت للسائق</small>':'');
  const act=(staff?`<button data-a="edit" data-i="${x.id}">تعديل</button><button data-a="up" data-i="${x.id}" aria-label="أعلى">↑</button><button data-a="dn" data-i="${x.id}" aria-label="أسفل">↓</button><button data-a="del" data-i="${x.id}" aria-label="حذف">✕</button>`:'')
   +(m&&open?`<button data-a="note" data-i="${x.id}" aria-label="ملاحظة">✏️</button>`+(staff?'':`<button data-a="cancel" data-i="${x.id}">إلغاء</button>`):'');
  const from=x.stop_id?esc(nm(x.stop_id)):'📍 '+esc(x.pickup_text||'—');
  return `<div class="row"><span class="no ${i<cap?'':'w'}">${i+1}</span><div class="t">${esc(x.name)}${m?' (أنت)':''}<small>${i<cap?(cap===Infinity?'محجوز':'مؤكد'):'احتياطي رقم '+(i-cap+1)} - من ${from} إلى ${esc(x.drop_name||'—')}</small>${x.created_at?`<small>🕒 وقت الحجز: ${bt(x.created_at,'ms')}</small>`:''}${nt}</div><div class="a">${act}</div></div>`};
 if(!bs.length)return '<p class="mut">مفيش حجوزات لسه على العربة دي.</p>';
 const n=Math.min(bs.length,cap),all=bs.map(row);
 return (cap===Infinity?'':`<div class="sh">✅ المقاعد المؤكدة (${n} من ${cap}) - بالأسبق في الحجز (بالثانية)</div>`)+all.slice(0,n).join('')
  +(bs.length>n?`<div class="sh w">⏳ قائمة الاحتياطي (${bs.length-n}) - بتتأكد تلقائي لو حد اعتذر</div>`+all.slice(n).join(''):'')}
function sumHtml(c,conf){const oth=conf.filter(x=>!x.stop_id);
 return P(c).map((p,i)=>{const l=conf.filter(x=>x.stop_id===p.id);return `<details ${l.length?'open':''}><summary>${i+1}. ${esc(p.name)} - ${l.length} راكب</summary>${l.map(x=>`<div>${esc(x.name)} ← ${esc(x.drop_name||'—')}${notes[x.id]?' - 📝 '+esc(notes[x.id]):''}</div>`).join('')||'<div class="mut">لا أحد</div>'}</details>`}).join('')
 +(oth.length?`<details open><summary>📍 أماكن أخرى (بالوصف) - ${oth.length} راكب</summary>${oth.map(x=>`<div>${esc(x.name)} - ${esc(x.pickup_text||'')} ← ${esc(x.drop_name||'—')}${notes[x.id]?' - 📝 '+esc(notes[x.id]):''}</div>`).join('')}</details>`:'')}
function ctlHtml(c,full){const s=c.status,PS=P(c);
 return `<div class="ctl"><button class="go" data-a="start" ${s==='open'||s==='closed'?'':'disabled'}>بدء الرحلة</button><button data-a="next" ${s==='going'&&PS.some(p=>p.ord>c.cur)?'':'disabled'}>وصلنا المحطة التالية</button><button class="red" data-a="end" ${s==='going'?'':'disabled'}>إنهاء الرحلة</button>
 ${s==='open'?(!opened(c)?'<button data-a="openb">فتح الحجز الآن</button>':'<button data-a="closeb">قفل الحجز</button>'):s==='closed'||(s==='done'&&full)?'<button data-a="openb">فتح الحجز</button>':'<button disabled>الحجز مقفول</button>'}
 <button data-a="sched" ${s==='open'||s==='closed'?'':'disabled'}>⏳ تحديد موعد فتح الحجز</button><button data-a="addp">+ إضافة راكب</button><button data-a="stn">🚏 إدارة المحطات</button><button data-a="editcar">✏️ تعديل بيانات الرحلة</button><button data-a="reset">♻️ تصفير الرحلة (رحلة جديدة)</button>${full?'<button data-a="regen">🔄 تغيير الرابط</button><button class="red" data-a="delcar">حذف العربة نهائيًا</button>':''}</div>`}
const notFound=()=>`<div class="card" style="text-align:center;margin-top:40px"><h2>الرابط ده مش موجود</h2><p class="mut">الرابط غير صحيح أو اتحذف أو اتغيّر. اطلب رابط جديد من المسؤول.</p></div>`;

/* ---- التوجيه ---- */
function render(){const r=R(),key=r.join('/')+'|'+(role||'');
 if(!sb){$('app').innerHTML='<div class="card">الصفحة لسه مش متوصلة بقاعدة البيانات. حط SUPABASE_URL و SUPABASE_ANON_KEY في الملف.</div>';return}
 if(key!==render.k){render.k=key;mount(r)}
 if(r[0]==='car')updCar();else if(r[0]==='admin'){if(role==='admin'){r[1]==='car'?updAdminCar():updDash()}}else updHome()}
function mount(r){const a=$('app');a.className='w'+(r[0]==='admin'&&role==='admin'?' wide':'');window.scrollTo(0,0);
 if(r[0]==='car'){fillSel.k='';a.innerHTML=`<div id="cbn"></div><div id="drv"></div><div id="cnt"></div><div id="bres"></div>
 <div class="card" id="fm"><b>احجز مقعدك</b>
 <label for="nm">الاسم</label><input id="nm" autocomplete="off" placeholder="اكتب اسمك">
 <label for="st">هتركب منين؟</label><select id="st"></select>
 <input id="pko" placeholder="اكتب وصف مكانك (الشارع - العمارة - علامة مميزة)" hidden style="margin-top:8px">
 <label for="dr">هتنزل فين؟</label><select id="dr"></select>
 <input id="dro" placeholder="اكتب اسم محطة النزول" hidden style="margin-top:8px">
 <button class="go" data-a="book" id="bk" style="width:100%;margin-top:14px;padding:13px">احجز</button></div>
 <div class="card"><b>خط السير</b><div id="mt"></div></div><div class="card"><b id="lt">قائمة الحجز</b><div id="list"></div></div><div id="sm"></div>`;
 $('st').onchange=()=>{$('pko').hidden=$('st').value!=='other'};$('dr').onchange=()=>{$('dro').hidden=$('dr').value!=='other'}}
 else if(r[0]==='admin'){a.innerHTML=role==='admin'?'<div id="ad"></div>':`<div class="card" style="max-width:380px;margin:20px auto"><b>دخول المسؤول</b><label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="off"><button class="go" data-a="login" style="width:100%;margin-top:12px">دخول</button></div>`}
 else a.innerHTML='<div id="hm"></div>'}
$('app').onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='pw')$('app').querySelector('[data-a=login]').click()};
window.onhashchange=async()=>{if(!sb)return;loaded=false;CARS=[];B=[];ST=[];prev=null;LAST=null;render();await auth();await load()};

function fillSel(c){const k=JSON.stringify(ST.filter(s=>s.car_id===c.id));if(fillSel.k===k||!$('st'))return;fillSel.k=k;const s=$('st').value,d=$('dr').value;
 $('st').innerHTML='<option value="">اختر محطة الركوب</option>'+P(c).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')+'<option value="other">أخرى (اكتب وصف مكانك)</option>';
 $('dr').innerHTML='<option value="">اختر محطة النزول</option>'+D(c).map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('')+'<option value="other">أخرى (اكتب اسم المحطة)</option>';
 if(s)$('st').value=s;if(d)$('dr').value=d;
 if(!P(c).length)$('st').value='other';if(!D(c).length)$('dr').value='other';
 $('pko').hidden=$('st').value!=='other';$('dro').hidden=$('dr').value!=='other'}

/* ---- الصفحة الرئيسية (مفيش قايمة عربات) ---- */
function updHome(){const h=$('hm');if(!h)return;
 h.innerHTML='<div class="card" style="text-align:center;margin-top:40px"><h1>🚐 حجز العربة</h1><p class="mut">للحجز، ادخل من الرابط الخاص بعربتك اللي بعتهولك السائق أو المسؤول.</p></div>'}

/* ---- صفحة العربة (راكب / سائق) ---- */
function updCar(){if(!$('cbn'))return;
 if(!loaded){$('cbn').innerHTML='<p class="mut">جارٍ التحميل…</p>';return}
 const c=CARS[0];if(!c){$('app').innerHTML=notFound();render.k='';return}
 fillSel(c);const bs=carB(c),conf=bs.slice(0,capOf(c)),g=grp(c);
 $('cbn').innerHTML=`<div class="top"><h1>${esc(c.name)} ${g?`<span class="tag">${esc(g.name)}</span>`:''}</h1>${role?`<button data-a="out">خروج (${role==='admin'?'مسؤول':'سائق'})</button>`:'<button data-a="dlogin">🔑 دخول السائق</button>'}</div>${c.details?`<p class="mut">${esc(c.details)}</p>`:''}
 ${role?`<div class="card" style="margin-top:10px">🚌 الرحلات السابقة لهذه العربة: <b>${c.trips_done||0}</b></div>`:''}<div class="ban${c.status==='going'?' g':''}" aria-live="polite">${esc(banner(c))}</div>`;
 $('drv').innerHTML=role?`<div class="card"><b>${role==='admin'?'تحكم المسؤول':'لوحة السائق'}</b>${ctlHtml(c,role==='admin')}${role==='admin'?`<div style="margin-top:10px"><button data-a="go" data-p="admin/car/${c.id}">فتح في لوحة التحكم الكاملة</button></div>`:''}</div>`:'';
 $('cnt').innerHTML=cntHtml(c,conf,bs.length-conf.length);
 $('bres').innerHTML=LAST&&LAST.car===c.id?`<div class="card" style="border:2px solid var(--go)"><div class="top"><b>✅ تم تسجيل حجزك</b><button data-a="bresx" aria-label="إغلاق">✕</button></div><p style="margin:6px 0 0">${esc(LAST.name)} - ${esc(LAST.pos)}</p><p style="margin:4px 0 0">🕒 وقت حجزك بالظبط: <b dir="ltr">${esc(LAST.time)}</b></p></div>`:'';
 $('fm').hidden=!(c.status==='open'&&opened(c));clearTimeout(updCar.t);if(c.status==='open'&&c.book_at&&!opened(c))updCar.t=setTimeout(load,Math.min(Date.parse(c.book_at)-(Date.now()+skew)+400,2147000000));
 $('mt').innerHTML=metroHtml(c,conf);$('list').innerHTML=rowsHtml(c,bs,!!role);
 $('sm').innerHTML=role?`<div class="card"><b>كشف الركاب بالمحطات</b>${sumHtml(c,conf)}</div>`:''}
async function doBook(){const c=CARS[0];if(!c)return;if(c.status!=='open'||!opened(c))return toast('الحجز لسه مفتحش');
 const n=$('nm').value.trim(),sv=$('st').value,pt=$('pko').value.trim(),dv=$('dr').value,drop=dv==='other'?$('dro').value.trim():dv;
 if(n.length<2)return toast('اكتب اسمك الأول');
 if(carB(c).some(x=>nk(x.name)===nk(n)))return toast('الاسم ده محجوز بالفعل في العربة دي');
 if(c.capacity!=null&&carB(c).some(x=>x.id in mine))return toast('انت حاجز قبل كده في العربة دي من الجهاز ده');
 if(!sv)return toast('اختار محطة الركوب');
 if(sv==='other'&&pt.length<3)return toast('اكتب وصف مكانك (الشارع / العمارة)');if(drop.length<2)return toast('اختار محطة النزول أو اكتبها');
 const r=await rpc('book',{p_token:R()[1],p_name:n,p_stop:sv==='other'?0:+sv,p_pick:sv==='other'?pt:'',p_drop:drop,p_dev:dev});if(!r)return;
 mine[r.data.id]={s:r.data.secret,n:''};saveMine();$('nm').value='';$('pko').value='';$('dro').value='';
 const cc=CARS[0]||c,pos=carB(cc).findIndex(x=>x.id===r.data.id)+1,cp=capOf(cc);
 LAST={car:cc.id,name:n,pos:pos<=cp?'رقمك '+pos+' (مؤكد)':'احتياطي رقم '+(pos-cp),time:bt(r.data.created_at,'ms')};render();toast(pos<=cp?`تم حجزك، رقمك ${pos}`:`العربة مكتملة، انت احتياطي رقم ${pos-cp}`)}

/* ---- لوحة المسؤول ---- */
function carCard(c){const bs=carB(c),cp=capOf(c),conf=Math.min(bs.length,cp),w=Math.max(0,bs.length-cp),p=cp===Infinity?0:Math.round(conf/cp*100),g=grp(c),cs=P(c).find(s=>s.ord===c.cur),wait=c.status==='open'&&!opened(c);
 return `<article class="cc ${c.status}" data-a="opencar" data-i="${c.id}" tabindex="0" role="button"><div class="ct"><b>${esc(c.name)}</b>${g?`<span class="tag">${esc(g.name)}</span>`:''}</div>
 ${c.details?`<div class="mut sm">${esc(c.details)}</div>`:''}${cp===Infinity?'':`<div class="bar"><i style="width:${p}%"></i></div>`}
 <div class="sm">${cp===Infinity?bs.length+' حاجز (غير محدودة العدد)':conf+'/'+cp+' مقعد'+(w?' - احتياطي '+w:'')}</div>
 <div class="sm mut">${c.depart?'🕒 '+t12(c.depart):''}${wait?' - ⏳ الحجز يفتح '+bt(c.book_at):''}${c.status==='going'&&cs?' - عند: '+esc(cs.name):''} - رحلات سابقة: ${c.trips_done||0}</div>
 <div class="cb"><button data-a="opencar" data-i="${c.id}">فتح والتحكم</button><button data-a="copy" data-i="${c.id}">🔗 رابط</button></div></article>`}
function updDash(){const d=$('ad');if(!d)return;if(!loaded){d.innerHTML='<p class="mut">جارٍ التحميل…</p>';return}
 const cnf=c=>Math.min(carB(c).length,capOf(c)),wt=c=>Math.max(0,carB(c).length-capOf(c));
 const ac=CARS.filter(c=>filt==='all'||(filt==='none'?!grp(c):c.group_id===+filt));
 const secs=[['🟢 عربات متاحة للحجز',ac.filter(c=>c.status==='open')],['🔒 عربات مغلقة / منتهية',ac.filter(c=>c.status==='closed'||c.status==='done')],['🚌 رحلات جارية الآن',ac.filter(c=>c.status==='going')]];
 const nOpen=CARS.filter(c=>c.status==='open').length,nClosed=CARS.filter(c=>c.status==='closed'||c.status==='done').length,nGo=CARS.filter(c=>c.status==='going').length,nNone=CARS.filter(c=>!grp(c)).length;
 d.innerHTML=`<div class="top"><div><h1>لوحة التحكم</h1><div class="mut sm">المسؤول</div></div>
 <div class="bt"><button class="go" data-a="addcar">+ إضافة عربة</button><button data-a="grp">المجموعات</button><button data-a="pws">تغيير باسورد المسؤول</button><button data-a="out">خروج</button></div></div>
 <div class="kpis"><div class="kpi"><b>${nOpen}</b>عربات متاحة</div><div class="kpi x"><b>${nClosed}</b>عربات مغلقة</div><div class="kpi a"><b>${nGo}</b>رحلات جارية</div>
 <div class="kpi"><b>${CARS.reduce((a,c)=>a+cnf(c),0)}</b>ركاب مؤكدين</div><div class="kpi x"><b>${CARS.reduce((a,c)=>a+wt(c),0)}</b>احتياطي</div></div>
 <div class="chips"><button class="${filt==='all'?'on':''}" data-a="filt" data-v="all">الكل (${CARS.length})</button>${GR.map(g=>`<button class="${filt==g.id?'on':''}" data-a="filt" data-v="${g.id}">${esc(g.name)} (${CARS.filter(c=>c.group_id===g.id).length})</button>`).join('')}${nNone?`<button class="${filt==='none'?'on':''}" data-a="filt" data-v="none">بدون مجموعة (${nNone})</button>`:''}</div>`
 +secs.map(s=>`<details class="sec" open><summary>${s[0]} <span class="tag">${s[1].length}</span></summary><div class="gr">${s[1].map(carCard).join('')||'<p class="mut">لا توجد عربات هنا.</p>'}</div></details>`).join('')}
function updAdminCar(){const d=$('app');if(!loaded)return;const c=curCar();
 if(!c){d.innerHTML=notFound();render.k='';return}
 const bs=carB(c),conf=bs.slice(0,capOf(c)),w=bs.length-conf.length,g=grp(c),s=c.status;
 d.innerHTML=`<div><button data-a="go" data-p="admin">← لوحة التحكم</button></div>
 <div class="card"><div class="ct"><h1>${esc(c.name)}</h1><span class="stt ${s}">${STL[s]}</span></div>
 <div class="mut sm">${g?esc(g.name)+' - ':''}${c.capacity==null?'غير محدودة العدد':c.capacity+' مقعد'}${c.depart?' - 🕒 '+t12(c.depart):''}${c.book_at?' - ⏳ الحجز يفتح '+bt(c.book_at):''} - 🚌 رحلات سابقة: ${c.trips_done||0}</div>${c.details?`<p>${esc(c.details)}</p>`:''}
 <div class="lk"><input readonly value="${esc(linkT(c.token))}" aria-label="رابط العربة"><button data-a="copy" data-i="${c.id}">نسخ الرابط</button></div>
 <p class="mut sm" style="margin:6px 0 0">الرابط ده + باسورد السائق (بتحدده من "تعديل بيانات الرحلة") هما كل اللي السائق محتاجه.</p>${ctlHtml(c,true)}</div>
 <div class="ban${s==='going'?' g':''}">${esc(banner(c))}</div>${cntHtml(c,conf,w)}
 <div class="two"><div class="card"><b>خط السير</b>${metroHtml(c,conf)}</div><div><div class="card"><b>قائمة الحجز</b>${rowsHtml(c,bs,true)}</div><div class="card"><b>كشف الركاب بالمحطات</b>${sumHtml(c,conf)}</div></div></div>`}

/* ---- نوافذ ---- */
function form(title,fields,ok){$('dt').textContent=title;
 $('df').innerHTML=fields.map(f=>`<label>${f.l}`+(f.t==='sel'?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:f.t==='area'?`<textarea name="${f.k}" rows="3">${esc(f.v)}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" ${f.dl?'list="dl"':''}>`)+'</label>').join('')+`<datalist id="dl">${D(curCar()).map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>`;
 $('dok').onclick=e=>{e.preventDefault();const v={};new FormData($('dform')).forEach((x,k)=>v[k]=x);$('dlg').close();ok(v)};$('dlg').showModal()}
const pk=()=>[...P(curCar()).map(s=>[s.id,s.name]),[0,'أخرى (اكتب الوصف تحت)']];
const showCreds=(c,token,pw)=>form(pw?'تم! احفظ البيانات دي':'الرابط الجديد',[{k:'l',l:'رابط العربة (ابعته للركاب وللسائق)',v:linkT(token)},...(pw?[{k:'p',l:'باسورد السائق (بيظهر مرة واحدة)',v:pw}]:[])],()=>copy(linkT(token)));
function carForm(c,drv){const f=c&&c.depart?from24(c.depart):{h:7,m:0,ap:''},ob=isoToCairo(c&&c.book_at),bf=ob.t?from24(ob.t):{h:7,m:0,ap:'ص'};
 form(c?(drv?'تعديل بيانات الرحلة':'تعديل '+c.name):'إضافة عربة جديدة',[
  {k:'n',l:'اسم العربة / الرحلة',v:c?c.name:''},
  ...(drv?[]:[{k:'g',l:'المجموعة (القسم)',t:'sel',o:[['','بدون مجموعة'],...GR.map(g=>[g.id,g.name]),['new','+ مجموعة جديدة']],v:c&&c.group_id||''},
  {k:'g2',l:'اسم المجموعة الجديدة (لو اخترت + مجموعة جديدة)',v:''}]),
  {k:'cm',l:'نوع العربة',t:'sel',o:[['l','محدودة العدد (مقاعد + احتياطي)'],['u','غير محدودة العدد (بدون احتياطي)']],v:c&&c.capacity==null?'u':'l'},
  {k:'c',l:'عدد المقاعد (للمحدودة فقط)',t:'number',v:c&&c.capacity?c.capacity:14},
  {k:'d',l:'التفاصيل (مثلًا: اسم المدرسة أو الكنيسة أو المكان)',t:'area',v:c&&c.details||''},
  {k:'h',l:'موعد انطلاق الرحلة - الساعة',t:'sel',o:HR,v:f.h},{k:'m',l:'الدقيقة',t:'sel',o:MN,v:f.m},
  {k:'a',l:'صباحًا / مساءً',t:'sel',o:[['','بدون موعد'],['ص','ص (صباحًا)'],['م','م (مساءً)']],v:f.ap},
  {k:'bd',l:'⏳ فتح الحجز تلقائيًا - التاريخ (اتركه فاضي = الحجز مفتوح فورًا)',t:'date',v:ob.d},
  {k:'bh',l:'ساعة فتح الحجز',t:'sel',o:HR,v:bf.h},{k:'bm',l:'الدقيقة',t:'sel',o:MN,v:bf.m},
  {k:'ba',l:'صباحًا / مساءً',t:'sel',o:[['ص','ص (صباحًا)'],['م','م (مساءً)']],v:bf.ap||'ص'},
  {k:'w',l:c?'باسورد سائق جديد (اتركه فاضي للإبقاء على القديم)':'باسورد السائق (اتركه فاضي ويتولّد تلقائي)',t:'text',v:''}],
 async v=>{let g=v.g;if(!drv&&g==='new'){if((v.g2||'').trim().length<2)return toast('اكتب اسم المجموعة الجديدة');const r=await rpc('staff_add_group',{pw:PW,p_name:v.g2});if(!r)return;g=r.data}
  if(!v.n.trim())return toast('اكتب اسم العربة');
  const a={p_name:v.n,p_cap:v.cm==='u'?null:(+v.c||14),p_details:v.d,p_depart:to24(v.h,v.m,v.a),p_dpw:v.w,p_bookat:v.bd?cairoToIso(v.bd,to24(v.bh,v.bm,v.ba)):null};
  if(c&&drv){await rpc('staff_edit_car_drv',{pw:PW,p_car:c.id,...a},'تم حفظ التعديلات')}
  else if(c){const r=await rpc('staff_edit_car',{pw:PW,p_id:c.id,p_group:g?+g:null,...a},'تم حفظ التعديلات');if(r&&v.w.trim())toast('تم حفظ التعديلات وتغيير باسورد السائق')}
  else{const r=await rpc('staff_add_car',{pw:PW,p_group:g?+g:null,...a});if(r&&r.data)showCreds(null,r.data.token,r.data.pw||v.w.trim())}})}

function renderMgr(c){const li=l=>l.map(s=>`<div class="row"><div class="t">${esc(s.name)}</div><div class="a"><button data-m="ren" data-i="${s.id}">تعديل</button><button data-m="del" data-i="${s.id}">✕</button></div></div>`).join('')||'<p class="mut sm">لسه مفيش محطات.</p>';
 $('mg').innerHTML=`<h3 style="margin:0 0 6px">محطات ركوب ${esc(c.name)} (خط السير)</h3>${li(P(c))}<h3 style="margin:16px 0 6px">محطات النزول</h3>${li(D(c))}<h3 style="margin:16px 0 0">إضافة محطة</h3>
 <label>النوع<select id="ak"><option value="pickup">ركوب (في خط السير)</option><option value="drop">نزول</option></select></label><label>الاسم<input id="an"></label><label>مكانها<select id="aa"></select></label>
 <button class="go" id="ab" style="width:100%;margin-top:10px">إضافة المحطة</button>`;
 fillAfter(c);$('ak').onchange=()=>fillAfter(c);
 $('ab').onclick=async()=>{const n=$('an').value.trim();if(n.length<2)return toast('اكتب اسم المحطة');const r=await rpc('staff_add_stop',{pw:PW,p_car:c.id,p_kind:$('ak').value,p_name:n,p_after:+$('aa').value},'تمت إضافة المحطة');if(r)renderMgr(curCar()||c)}}
$('mgx').onclick=()=>$('dlg2').close();
$('mg').onclick=async e=>{const b=e.target.closest('button[data-m]');if(!b)return;const id=+b.dataset.i,s=ST.find(x=>x.id===id);
 if(b.dataset.m==='ren'){const n=prompt('الاسم الجديد للمحطة',s.name);if(n&&n.trim().length>1){await rpc('staff_rename_stop',{pw:PW,p_id:id,p_name:n},'تم التعديل');renderMgr(curCar())}}
 if(b.dataset.m==='del'&&confirm('حذف محطة '+s.name+'؟')){await rpc('staff_delete_stop',{pw:PW,p_id:id},'تم الحذف');renderMgr(curCar())}};

/* ---- الأحداث ---- */
$('app').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i||0,car=curCar(),cid=car?car.id:0,x=B.find(y=>y.id===i);
 const trip=act=>rpc('staff_trip',{pw:PW,p_car:cid,act});
 switch(a){
 case 'go':go(b.dataset.p);break;
 case 'opencar':go('admin/car/'+i);break;
 case 'copy':{const c=CARS.find(y=>y.id===i);if(c&&c.token)copy(linkT(c.token));break}
 case 'filt':filt=b.dataset.v;render();break;
 case 'book':doBook();break;
 case 'bresx':LAST=null;render();break;
 case 'login':{const pw=$('pw').value;const {data}=await sb.rpc('admin_login',{pw});if(!data)return toast('كلمة المرور غير صحيحة');role='admin';PW=pw;ssSet('adm',pw);await load();break}
 case 'dlogin':form('دخول السائق',[{k:'p',l:'باسورد السائق',t:'password',v:''}],async v=>{const t=R()[1];const {data}=await sb.rpc('driver_login',{p_token:t,pw:v.p});if(!data)return toast('الباسورد غير صحيح');role=data;PW=v.p;ssSet(data==='admin'?'adm':'drv:'+t,v.p);await load()});break;
 case 'out':logout();break;
 case 'addcar':carForm(null,false);break;
 case 'grp':renderGrp();$('dlg3').showModal();break;
 case 'stn':renderMgr(car);$('dlg2').showModal();break;
 case 'pws':form('تغيير باسورد المسؤول',[{k:'a',l:'الباسورد الجديد (4 أحرف على الأقل)',t:'password',v:''}],async v=>{if(!v.a)return;const r=await rpc('staff_set_pw',{pw:PW,newpw:v.a},'تم تغيير الباسورد');if(r){PW=v.a;ssSet('adm',PW)}});break;
 case 'sched':{const ob=isoToCairo(car.book_at),bf=ob.t?from24(ob.t):{h:7,m:0,ap:'ص'};form('تحديد موعد فتح الحجز - '+car.name,[
  {k:'bd',l:'التاريخ',t:'date',v:ob.d||isoToCairo(new Date().toISOString()).d},{k:'bh',l:'الساعة',t:'sel',o:HR,v:bf.h},{k:'bm',l:'الدقيقة',t:'sel',o:MN,v:bf.m},{k:'ba',l:'صباحًا / مساءً',t:'sel',o:[['ص','ص (صباحًا)'],['م','م (مساءً)']],v:bf.ap||'ص'},
  {k:'x',l:'الإجراء',t:'sel',o:[['s','حفظ الموعد - الحجز يفتح تلقائيًا فيه'],['c','إلغاء الجدولة - الحجز يفتح فورًا']],v:'s'}],
  v=>{const off=v.x==='c'||!v.bd;rpc('staff_set_bookat',{pw:PW,p_car:cid,p_bookat:off?null:cairoToIso(v.bd,to24(v.bh,v.bm,v.ba))},off?'تم إلغاء الجدولة':'تم حفظ موعد فتح الحجز')});break}
 case 'start':confirm('بدء رحلة '+car.name+' وقفل الحجز؟')&&trip('start');break;
 case 'next':trip('next');break;
 case 'end':confirm('إنهاء رحلة '+car.name+'؟')&&trip('end');break;
 case 'closeb':trip('close');break;
 case 'openb':trip('open');break;
 case 'reset':confirm('تصفير '+car.name+' وبدء رحلة جديدة؟ هيتمسح كل الحجوزات والملاحظات')&&confirm('متأكد؟ مفيش رجوع')&&trip('reset');break;
 case 'editcar':carForm(car,role!=='admin');break;
 case 'regen':if(confirm('تغيير رابط '+car.name+'؟ الرابط القديم هيبطل يفتح فورًا، وهتبعت الجديد للركاب والسائق (نفس التفاصيل والحجوزات بتفضل زي ما هي).')){const r=await rpc('staff_regen_token',{pw:PW,p_id:cid});if(r)showCreds(car,r.data,null)}break;
 case 'delcar':if(confirm('حذف '+car.name+' نهائيًا مع كل حجوزاتها؟')&&confirm('متأكد؟ الرابط بتاعها هيبطل يفتح ومفيش رجوع')){const r=await rpc('staff_delete_car',{pw:PW,p_id:cid},'تم حذف العربة والرابط بتاعها');if(r)go('admin')}break;
 case 'addp':passForm(null,cid);break;
 case 'edit':passForm(x,cid);break;
 case 'del':confirm('حذف '+x.name+'؟')&&rpc('staff_delete',{pw:PW,p_id:i},'تم الحذف');break;
 case 'up':rpc('staff_move',{pw:PW,p_id:i,p_dir:-1});break;
 case 'dn':rpc('staff_move',{pw:PW,p_id:i,p_dir:1});break;
 case 'note':form('ملاحظة للسائق',[{k:'n',l:'اكتب ملاحظتك (السائق والمسؤولين بس هيشوفوها)',t:'area',v:mine[i]?mine[i].n:''}],async v=>{const r=await rpc('set_note',{p_id:i,p_secret:mine[i].s,p_note:v.n},'تم حفظ الملاحظة');if(r){mine[i].n=v.n.trim();saveMine();render()}});break;
 case 'cancel':if(confirm('إلغاء حجزك؟'))rpc('cancel_mine',{p_id:i,p_secret:mine[i].s},'تم إلغاء حجزك').then(r=>{if(r){delete mine[i];saveMine()}});break;
 }};

if(sb){(async()=>{await auth();await load();setInterval(()=>{if(!document.hidden)load()},5000)})()}else render();
</script></body></html>
